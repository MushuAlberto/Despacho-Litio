<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Shield / Squircle Background -->
  <rect width="64" height="64" rx="16" fill="#461D77"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#7177EC" stroke-opacity="0.4" stroke-width="2"/>
  
  <!-- Subtle Gradient Accent Glow -->
  <circle cx="32" cy="32" r="22" fill="#3FAA88" fill-opacity="0.18" />

  <!-- Crystal Hexagon / Lithium Ring Representation -->
  <polygon points="32,12 49,22 49,42 32,52 15,42 15,22" 
           stroke="#3FAA88" stroke-width="2.5" stroke-linejoin="round" fill="none" opacity="0.9" />
  
  <!-- Inner Dynamic Hexagon -->
  <polygon points="32,18 44,25 44,39 32,46 20,39 20,25" 
           stroke="#FAF5E6" stroke-width="1.8" stroke-linejoin="round" fill="#FAF5E6" fill-opacity="0.08" />

  <!-- Stylized "L" (Litio) & Crystal Core in Gold & Emerald -->
  <path d="M26 24V40H38" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Glowing Center Atom / Node -->
  <circle cx="38" cy="27" r="3" fill="#3FAA88"/>
  <circle cx="38" cy="27" r="1.5" fill="#FFFFFF"/>
</svg>
